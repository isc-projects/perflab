---
services:
  perflab_web:
    build:
      context: ..
      dockerfile: Dockerfile.devel
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9222:9222"
    entrypoint: ["/bin/bash", "-c"]
    command: ["/usr/sbin/sshd -D & exec node --inspect=0.0.0.0:9222 /perflab/perflab-httpd.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8000/api/control/paused', function(r) { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', function() { process.exit(1) })\""]
      interval: 5s
      timeout: 2s
      retries: 10
    init: true

  perflab_agent:
    build:
      context: ..
      dockerfile: Dockerfile.devel
    entrypoint: ["/bin/bash", "-c"]
    command: ["/usr/sbin/sshd -D & exec node --inspect=0.0.0.0:9229 /perflab/perflab-tester.js"]
    ports:
      - "127.0.0.1:9229:9229"
    depends_on:
      perflab_web:
        condition: service_healthy
    init: true
    privileged: true
